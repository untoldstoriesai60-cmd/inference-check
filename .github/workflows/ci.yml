name: Demo compatibility checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python demo.py
      - run: python -m unittest
